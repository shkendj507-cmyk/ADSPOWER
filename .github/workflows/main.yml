name: EasyAds 24/7 Unified Proxy Server & Creator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run Mode: server (Full Proxy Server + Auto-Swap) or creator (Creator Only)'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - creator
      threads:
        description: 'Concurrent Browser Threads'
        required: true
        default: '2'
        type: string
      accounts:
        description: 'Total Accounts (Only if mode = creator)'
        required: false
        default: '5'
        type: string
      enable_ssh:
        description: 'Enable Live Terminal Login'
        required: false
        default: true
        type: boolean
      ssh_password:
        description: 'Login Password for user (runner)'
        required: false
        default: 'Manik123@'
        type: string
      tailscale_authkey:
        description: 'Tailscale Auth Key (Optional - tskey-auth-...)'
        required: false
        default: ''
        type: string
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  run-service:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TS_KEY: ${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY }}
      LOGIN_PASS: ${{ github.event.inputs.ssh_password || 'Manik123@' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Display System Memory info
      - name: System Memory Info
        run: |
          echo "=== SYSTEM MEMORY ==="
          free -h
          echo ""

      # Set Password for 'runner' and 'root' user
      - name: Setup User & Password for Remote Login
        run: |
          echo "runner:${{ env.LOGIN_PASS }}" | sudo chpasswd
          echo "root:${{ env.LOGIN_PASS }}" | sudo chpasswd
          echo "================================================="
          echo " LOGIN USERNAME : runner (or root)"
          echo " LOGIN PASSWORD : ${{ env.LOGIN_PASS }}"
          echo "================================================="

      # Connect Tailscale with SSH enabled
      - name: Connect Tailscale with SSH (Optional)
        if: env.TS_KEY != ''
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ env.TS_KEY }}
          args: --ssh --hostname=github-runner

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Check Outgoing IP Info
        run: |
          echo "=== RUNNER IP & LOCATION ==="
          curl -s https://ipinfo.io/json || true
          echo ""

      - name: Run EasyAds Master System (6-Hour Continuous Service)
        run: |
          MODE="${{ github.event.inputs.mode || 'server' }}"
          THREADS="${{ github.event.inputs.threads || '2' }}"
          ACCOUNTS="${{ github.event.inputs.accounts || '5' }}"

          if [ "$MODE" = "server" ]; then
            echo "=========================================================================="
            echo " Starting 24/7 Unified Proxy Server (Port 1000) with Instant 0.001s Auto-Swap"
            echo " Threads: $THREADS | Auto-Creator Active | Pre-Claimed Reserve Active"
            echo "=========================================================================="
            # Runs main.py for up to 5.7 hours (342 minutes = 20520 seconds) before clean shutdown & commit
            timeout 20520 python main.py $THREADS || true
          else
            echo "Running Creator-Only mode ($ACCOUNTS accounts)..."
            python adspower_creator.py --headless $ACCOUNTS $THREADS
          fi

      - name: Commit and Push links.txt & Proxies to Repo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add links.txt proxy.txt proxies.txt claimed_proxies.json session.json 2>/dev/null || true
          git commit -m "Auto-update links.txt & claimed proxies [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed or nothing to push"

      - name: Upload links.txt as Downloadable Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-links-and-proxies
          path: |
            links.txt
            proxy.txt
            claimed_proxies.json

name: EasyAds 24/7 Unified Proxy Server & Creator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run Mode: server (Full Proxy Server + Auto-Swap) or creator (Creator Only)'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - creator
      threads:
        description: 'Concurrent Browser Threads'
        required: true
        default: '2'
        type: string
      accounts:
        description: 'Total Accounts (Only if mode = creator)'
        required: false
        default: '5'
        type: string
      enable_ssh:
        description: 'Enable Live Terminal Login'
        required: false
        default: true
        type: boolean
      ssh_password:
        description: 'Login Password for user (runner)'
        required: false
        default: 'Manik123@'
        type: string
      tailscale_authkey:
        description: 'Tailscale Auth Key (Optional - tskey-auth-...)'
        required: false
        default: ''
        type: string
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  run-service:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TS_KEY: ${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY }}
      LOGIN_PASS: ${{ github.event.inputs.ssh_password || 'Manik123@' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Display System Memory info
      - name: System Memory Info
        run: |
          echo "=== SYSTEM MEMORY ==="
          free -h
          echo ""

      # Set Password for 'runner' and 'root' user
      - name: Setup User & Password for Remote Login
        run: |
          echo "runner:${{ env.LOGIN_PASS }}" | sudo chpasswd
          echo "root:${{ env.LOGIN_PASS }}" | sudo chpasswd
          echo "================================================="
          echo " LOGIN USERNAME : runner (or root)"
          echo " LOGIN PASSWORD : ${{ env.LOGIN_PASS }}"
          echo "================================================="

      # Connect Tailscale with SSH enabled
      - name: Connect Tailscale with SSH (Optional)
        if: env.TS_KEY != ''
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ env.TS_KEY }}
          args: --ssh --hostname=github-runner

      # Display VPS Login Information (Summary & Console)
      - name: Display VPS Login Information
        run: |
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "Not Connected (Add tailscale_authkey)")
          HOST_NAME="github-runner"
          
          echo "================================================================"
          echo "                 🖥️ VPS LOGIN INFORMATION                       "
          echo "================================================================"
          echo " HOSTNAME     : $HOST_NAME"
          echo " TAILSCALE IP : $TS_IP"
          echo " USERNAME     : runner  (or root)"
          echo " PASSWORD     : ${{ env.LOGIN_PASS }}"
          echo " SSH COMMAND  : ssh runner@$HOST_NAME"
          echo " ALT COMMAND  : ssh runner@$TS_IP"
          echo " PROXY PORTS  : 1000 & 8080"
          echo " WEB SSH      : https://login.tailscale.com/admin/machines"
          echo "================================================================"

          # Write clean Markdown to GitHub Actions Run Summary
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🖥️ VPS & Proxy Server Login Information

          | Detail | Value |
          |---|---|
          | **Hostname** | \`$HOST_NAME\` |
          | **Tailscale IP** | \`$TS_IP\` |
          | **Username** | \`runner\` or \`root\` |
          | **Password** | \`${{ env.LOGIN_PASS }}\` |
          | **SSH Command** | \`ssh runner@$HOST_NAME\` or \`ssh runner@$TS_IP\` |
          | **Web Terminal** | [Open Tailscale Machines](https://login.tailscale.com/admin/machines) |
          | **Proxy Ports** | \`1000\` (Primary) & \`8080\` (Secondary) |
          | **Runtime** | Active for up to 6 Hours |

          > 💡 **Quick Connect Instructions:**
          > 1. Make sure Tailscale is connected on your PC.
          > 2. Open PowerShell or CMD and run: \`ssh runner@github-runner\`
          > 3. Enter password: \`${{ env.LOGIN_PASS }}\`
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Check Outgoing IP Info
        run: |
          echo "=== RUNNER IP & LOCATION ==="
          curl -s https://ipinfo.io/json || true
          echo ""

      - name: Run EasyAds Master System (6-Hour Continuous Service)
        run: |
          MODE="${{ github.event.inputs.mode || 'server' }}"
          THREADS="${{ github.event.inputs.threads || '2' }}"
          ACCOUNTS="${{ github.event.inputs.accounts || '5' }}"

          if [ "$MODE" = "server" ]; then
            echo "=========================================================================="
            echo " Starting 24/7 Unified Proxy Server (Ports 1000 & 8080) with Instant 0.001s Auto-Swap"
            echo " Threads: $THREADS | Auto-Creator Active | Pre-Claimed Reserve Active"
            echo "=========================================================================="
            # Allow non-root user (runner) to bind port 1000 and 8080 cleanly
            sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80
            # Run main.py with unbuffered realtime output
            export PYTHONUNBUFFERED=1
            python -u main.py "$THREADS"
          else
            echo "Running Creator-Only mode ($ACCOUNTS accounts)..."
            export PYTHONUNBUFFERED=1
            python -u adspower_creator.py --headless "$ACCOUNTS" "$THREADS"
          fi

      - name: Commit and Push links.txt & Proxies to Repo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add links.txt proxy.txt proxies.txt claimed_proxies.json session.json 2>/dev/null || true
          git commit -m "Auto-update links.txt & claimed proxies [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed or nothing to push"

      - name: Upload links.txt as Downloadable Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-links-and-proxies
          path: |
            links.txt
            proxy.txt
            proxies.txt
            claimed_proxies.json
            session.json
